[package]
name = "codemole"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codemole"
path = "src/main.rs"

[[bin]]
name = "codemole-desktop"
path = "src/bin/desktop.rs"

[dependencies]
clap      = { version = "4", features = ["derive"] }
regex     = "1"
walkdir   = "2"
rusqlite  = { version = "0.32", features = ["bundled"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.33", default-features = true }
rfd = "0.15"

[profile.release]
opt-level = 3        # 0–3 (o "z" para tamaño)
lto = true           # Link Time Optimization
codegen-units = 1    # Mejor optimización (más lento al compilar)
panic = "abort"      # Reduce tamaño del binario
strip = true         # Elimina símbolos (Rust 1. strip estable)
